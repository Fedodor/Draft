name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Scan working tree for credentials
        run: python scripts/secret_scan.py

  quality-gate:
    name: Quality gate (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
            infrastructure/seeders -> target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12.13"
          enable-cache: true
          cache-dependency-glob: ml/requirements.lock

      - name: Install Python dependencies
        run: |
          uv python install 3.12.13
          uv venv --python 3.12.13 --seed ml/venv
          uv pip install --require-hashes --python ml/venv/Scripts/python.exe -r ml/requirements.lock

      - name: Run quality gate
        run: pwsh -NoProfile -File scripts/verify.ps1 -ForceInstall

  gui-smoke:
    name: GUI smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
            infrastructure/seeders -> target
          key: gui-smoke

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # The Recheck checks edit the scratch database through Python; make the
      # interpreter explicit so they cannot silently turn into skips.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      # Launches the real Tauri binary against the Vite dev server and drives the
      # WebView2 renderer over CDP: CSP assets, tabs, GSI ingestion, card layout at
      # 900 and 800 px, and the overlay toggle. Windows PowerShell (5.1) is the
      # shell the script was verified on; it seeds the database itself when the
      # runner has none.
      - name: Run GUI smoke test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ui_smoke.ps1

      - name: Upload GUI smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke
          path: ${{ runner.temp }}/ui-smoke
          if-no-files-found: ignore

  gui-smoke-bundle:
    name: GUI smoke (packaged bundle)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
            infrastructure/seeders -> target
          key: gui-smoke-bundle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      # Builds the NSIS release bundle, installs it into a temporary directory and
      # drives the installed app over CDP. The frontend is embedded and the model
      # comes from the installed resources, so this catches packaging-only
      # regressions the dev-build job cannot see (renamed binary, missing
      # resources, bundle-relative asset paths).
      - name: Run GUI smoke test against the packaged bundle
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ui_smoke.ps1 -Bundle

      - name: Upload GUI smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-bundle
          path: ${{ runner.temp }}/ui-smoke
          if-no-files-found: ignore
